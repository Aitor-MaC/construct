<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <clipPath id="shape"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
  <radialGradient id="bg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#0F2214"/>
    <stop offset="0.6" stop-color="#07100A"/>
    <stop offset="1" stop-color="#050806"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>
<g filter="url(#drop)">
  <g clip-path="url(#shape)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    
    <g filter="url(#glow)" font-family="'SF Mono', Menlo, 'Hiragino Sans', monospace" font-weight="700">
      <text x="318" y="620" font-size="380" fill="#00FF41" text-anchor="middle">❯</text>
      <rect x="520" y="560" width="230" height="58" rx="6" fill="#00FF41"/>
    </g>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#00FF41" stroke-opacity="0.18" stroke-width="2"/>
</g>
</svg>